# @package _global_
# The line above must remain the first line of this file.

# Stage-1 (reconstruction) finetuning of medvae_4_1_2d on BoostNet, with images
# resized to 384 x 384. Place in MedVAE/configs/experiment/ and run:
#   medvae_finetune experiment=medvae_4x_1c_2d_boostnet
#
# Changes from MedVAE's medvae_4x_1c_2d_finetuning.yaml:
#   dataloader   boostnet (BoostNet JPEG images)
#   batch size   4 with 2 gradient-accumulation steps (effective batch 8);
#                a batch of 8 exceeded the memory of a 40 GB A100
#   precision    bf16, to reduce activation memory
#   disc_start   1500 instead of 3125: with about 51 optimiser steps per epoch,
#                the discriminator loss starts after about 30 epochs

defaults:
  - override /dataloader: boostnet.yaml
  - override /metrics: reconstruction_minimal.yaml
  - override /criterion: lpips_with_discriminator.yaml

task_name: boostnet_finetuning
model_name: medvae_4_1_2d
dataset_name: boostnet
merge_channels: true
stage2: false
device: cuda

mixed_precision: "bf16"
gradient_accumulation_steps: 2
max_epoch: 100
batch_size: 4
log_every_n_steps: 20
base_learning_rate: 4.5e-6
ema_decay: null
fast_dev_run: false

criterion:
  num_channels: 1
  disc_start: 1500
