# @package _global_
# The line above must remain the first line of this file.

# Stage-1 (reconstruction) finetuning of medvae_4_1_2d on BoostNet, with each
# radiograph padded to a square before resizing to 384 x 384. Place in
# MedVAE/configs/experiment/ and run:
#   medvae_finetune experiment=medvae_4x_1c_2d_boostnet_aspect
#
# Changes from MedVAE's medvae_4x_1c_2d_finetuning.yaml:
#   dataloader   boostnet_aspect (aspect-preserving loader)
#   batch size   2 with 4 gradient-accumulation steps (effective batch 8)
#   precision    bf16, to reduce activation memory
#   disc_start   1500 instead of 3125: with about 51 optimiser steps per epoch,
#                the discriminator loss starts after about 30 epochs

defaults:
  - override /dataloader: boostnet_aspect.yaml
  - override /metrics: reconstruction_minimal.yaml
  - override /criterion: lpips_with_discriminator.yaml

task_name: boostnet_finetuning_aspect
model_name: medvae_4_1_2d
dataset_name: boostnet
merge_channels: true
stage2: false
device: cuda

mixed_precision: "bf16"
gradient_accumulation_steps: 4
max_epoch: 100
batch_size: 2
log_every_n_steps: 20
base_learning_rate: 4.5e-6
ema_decay: null
fast_dev_run: false

criterion:
  num_channels: 1
  disc_start: 1500
